<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light Theme Royal Blue to Vivid Blue Gradient -->
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E78FF" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
  </defs>

  <!-- Clean Solid White Squircle Background with soft light border -->
  <rect x="8" y="8" width="496" height="496" rx="124" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="12" />

  <!-- Symmetrical Left Pillar of Monogram 'H' -->
  <rect x="140" y="170" width="48" height="230" rx="24" fill="url(#blue-gradient)" />

  <!-- Symmetrical Right Pillar of Monogram 'H' -->
  <rect x="324" y="170" width="48" height="230" rx="24" fill="url(#blue-gradient)" />

  <!-- Curved Archway Crossbar (Stroked for modern tech appearance) -->
  <path d="M 188 290 C 220 230, 292 230, 324 290" stroke="url(#blue-gradient)" stroke-width="32" stroke-linecap="round" fill="none" />

  <!-- Floating Guiding Star (Overlapping rotated squares representing Rub el Hizb) -->
  <g transform="translate(256, 130)">
    <!-- First square -->
    <rect x="-30" y="-30" width="60" height="60" rx="10" fill="url(#blue-gradient)" />
    <!-- Second square rotated 45 degrees -->
    <rect x="-30" y="-30" width="60" height="60" rx="10" fill="url(#blue-gradient)" transform="rotate(45)" />
    <!-- Center core circle -->
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" />
  </g>
</svg>
